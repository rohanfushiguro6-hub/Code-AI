<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>Code AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b14;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

header{
  text-align:center;
  padding:28px 15px 18px;
}

h1{
  margin:0;
  font-size:30px;
}

.sub{
  color:#9da7bd;
  margin-top:8px;
  font-size:14px;
}

main{
  width:92%;
  max-width:600px;
  margin:auto;
}

.box{
  background:#111725;
  border:1px solid #263047;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

textarea{
  width:100%;
  height:160px;
  resize:vertical;
  padding:14px;
  background:#0b1020;
  color:#fff;
  border:1px solid #303b55;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

textarea:focus{
  border-color:#667eea;
}

button{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.generate{
  background:#fff;
  color:#080b14;
}

.copy{
  background:#263047;
  color:#fff;
}

.answer{
  white-space:pre-wrap;
  word-break:break-word;
  background:#0b1020;
  border:1px solid #27324a;
  border-radius:10px;
  padding:14px;
  min-height:150px;
  font-family:monospace;
  font-size:14px;
  overflow:auto;
}
</style>
</head>

<body>

<header>
  <h1>🤖 Code AI</h1>
  <div class="sub">AI Coding Assistant</div>
</header>

<main>

  <div class="box">

    <label>💬 What do you want to build?</label>

    <textarea
      id="prompt"
      placeholder="যেমন: একটা calculator app বানানোর HTML CSS JavaScript code দাও"
    ></textarea>

    <button class="generate" onclick="generateCode()">
      🚀 Generate Code
    </button>

  </div>

  <div class="box">

    <label>💻 AI Response</label>

    <div id="answer" class="answer">
এখানে AI-এর response দেখা যাবে...
    </div>

    <button class="copy" onclick="copyAnswer()">
      📋 Copy Code
    </button>

  </div>

</main>

<script>

async function generateCode(){

  const prompt =
    document.getElementById("prompt").value.trim();

  const answer =
    document.getElementById("answer");

  if(!prompt){

    answer.textContent =
      "আগে তুমি কী বানাতে চাও সেটা লিখো 🙂";

    return;
  }

  answer.textContent =
    "🤖 AI ভাবছে...";

  try{

    const response = await fetch(
      "https://falling-rain-9852.rohanfushiguro6.workers.dev/",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          prompt:prompt
        })
      }
    );

    const data =
      await response.json();

    if(data.error){

      answer.textContent =
        "❌ " + data.error;

      return;
    }

    answer.textContent =
      data.reply ||
      "কোনো response পাওয়া যায়নি।";

  }catch(error){

    answer.textContent =
      "❌ Server-এর সাথে connect করা যায়নি।";

  }

}


function copyAnswer(){

  const text =
    document.getElementById("answer").textContent;

  navigator.clipboard.writeText(text);

  alert("Copied ✅");

}

</script>

</body>
</html>
