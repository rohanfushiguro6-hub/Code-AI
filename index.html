<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>Code AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b14;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:28px 15px 18px;
}

h1{margin:0;font-size:30px}

.sub{
  color:#9da7bd;
  margin-top:8px;
}

main{
  width:92%;
  max-width:600px;
  margin:auto;
}

.box{
  background:#111725;
  border:1px solid #263047;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

textarea{
  width:100%;
  height:160px;
  padding:14px;
  background:#0b1020;
  color:#fff;
  border:1px solid #303b55;
  border-radius:10px;
  font-size:15px;
}

button{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}

.generate{
  background:#fff;
  color:#080b14;
}

.copy{
  background:#263047;
  color:#fff;
}

#answer{
  white-space:pre-wrap;
  word-break:break-word;
  background:#0b1020;
  border:1px solid #27324a;
  border-radius:10px;
  padding:14px;
  min-height:150px;
  font-family:monospace;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>🤖 Code AI</h1>
  <div class="sub">AI Coding Assistant</div>
</header>

<main>

<div class="box">

<textarea id="prompt"
placeholder="যেমন: একটা calculator app বানানোর HTML CSS JavaScript code দাও"></textarea>

<button class="generate" onclick="generateCode()">
🚀 Generate Code
</button>

</div>

<div class="box">

<b>💻 AI Response</b>

<div id="answer">
এখানে AI-এর response দেখা যাবে...
</div>

<button class="copy" onclick="copyAnswer()">
📋 Copy
</button>

</div>

</main>

<script>

const API_URL =
"https://falling-rain-9852.rohanfushiguro6.workers.dev/";

async function generateCode(){

  const prompt =
  document.getElementById("prompt").value.trim();

  const answer =
  document.getElementById("answer");

  if(!prompt){
    answer.textContent =
    "আগে কী বানাতে চাও সেটা লিখো 🙂";
    return;
  }

  answer.textContent =
  "🤖 AI ভাবছে...";

  try{

    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        prompt:prompt
      })
    });

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      answer.textContent =
      "❌ Server response:\n\n" + text;
      return;
    }

    if(!response.ok){
      answer.textContent =
      "❌ Error " + response.status +
      "\n\n" +
      (data.error || "Unknown error");
      return;
    }

    if(data.error){
      answer.textContent =
      "❌ " + data.error;
      return;
    }

    answer.textContent =
    data.reply ||
    "কোনো response পাওয়া যায়নি।";

  }catch(error){

    answer.textContent =
    "❌ Connection error\n\n" +
    error.message;

  }
}

function copyAnswer(){

  const text =
  document.getElementById("answer").textContent;

  navigator.clipboard.writeText(text);

  alert("Copied ✅");
}

</script>

</body>
</html>
